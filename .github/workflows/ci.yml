name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
            scripts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          # server 使用 legacy-peer-deps 绕过上游 @seekdb/default-embed 的 peer 依赖缺陷
          npm ci --prefix server --legacy-peer-deps
          npm ci --prefix web
          npm ci --prefix scripts

      - name: Typecheck & build
        run: |
          npm run build --prefix server
          npm run build --prefix web

      - name: Unit tests
        run: npm test

      # scripts/ 单测（evalMetrics/stats/datasets；纯 Node，不需要模型/浏览器/数据库）
      - name: Scripts unit tests
        run: npm run test:scripts

      # 交付/复现工具链自检（scripts/ 的 TS 类型检查；不需要模型/浏览器/数据库）
      - name: Typecheck scripts
        run: npm run typecheck:scripts

      # 赛题约束：推理只在浏览器端，server 不得引入 onnx/transformers 等推理依赖
      - name: Compliance checks
        run: npm run check:compliance
